name: Bug report
description: Something the tool did that it should not have done
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        A verdict that looks wrong is worth reporting even if you are not sure: a gate
        that decides something it cannot decide is the failure this project exists to
        avoid.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected instead, and what you saw.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: >
        The commands you ran, in order. A run that uses `--provider replay` or
        `--provider scripted` needs no key from a maintainer, so it reproduces faster.
      placeholder: |
        benchproofer ingest humaneval --limit 1
        benchproofer check humaneval --level static
      render: shell
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `benchproofer doctor`
      description: >
        This reports the version, the interpreter, the resolved settings, and which
        backends, oracles, and providers are available here. It usually answers the
        first three questions a maintainer would have.
      render: shell
    validations:
      required: true

  - type: textarea
    id: artifacts
    attributes:
      label: The bundle, if there is one
      description: >
        `manifest.json` says which gate produced which verdict, and `evidence/` holds
        what each gate wrote. Paste the relevant part, or attach the bundle directory.
      render: shell
    validations:
      required: false
