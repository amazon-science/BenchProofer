name: Feature request
description: A benchmark, backend, oracle, gate, provider, or behavior you need
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >
        All five kinds of component are plugins resolved through entry points, so yours
        works without being merged here. See the guides under `docs/guides/`. Open this
        issue when the component belongs in the tool itself, or when the tool is in your
        way.

  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: The task or corpus, and where the tool stops being able to help.
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of change is it
      options:
        - A benchmark adapter
        - A verification backend
        - A correctness oracle
        - A gate
        - A model provider
        - Command-line or reporting behavior
        - Something else
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you would like to happen
      description: >
        For a new gate, say what a bundle that passes the current gates can still get
        wrong: that is the argument a gate has to make.
    validations:
      required: true

  - type: checkboxes
    id: plugin
    attributes:
      label: Have you tried it as a plugin
      options:
        - label: I read the relevant guide under `docs/guides/`
          required: false
        - label: I am offering to write this
          required: false
