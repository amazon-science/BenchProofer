{# full file content at base_commit (htmx fragment) #}
<div class="card filecard" style="margin:6px 0 0">
  <h3>{{ path }} <span class="faint" style="font-weight:400;font-size:.78rem">{{ nlines }} lines @ base_commit</span>
    <button class="btn sm closebtn" type="button" style="margin-left:auto"
            onclick="this.closest('.filecard').parentNode.replaceChildren()">✕ collapse</button>
  </h3>
  <div class="body tight">
    <div class="codewrap"><pre class="code highlight">{{ src | hl(lang) | safe }}</pre></div>
  </div>
</div>
