site_name: Benchproofer
site_description: Turn any real-world benchmark into a formally verified one.
strict: true

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Concepts: concepts.md
  - Workflow: workflow.md
  - Reference:
      - Gates: gates.md
      - Benchmarks: benchmarks.md
      - Backends: backends.md
      - CLI: cli.md
  - Running it:
      - Smoke suite: smoke.md
      - Reproducibility: reproducibility.md
  - Extending it:
      - Architecture: architecture.md
      - Add a benchmark: guides/add-a-benchmark.md
      - Add a backend: guides/add-a-backend.md
      - Add a gate: guides/add-a-gate.md
      - Bring your own model: guides/bring-your-own-model.md
      - Bring your own agent: guides/bring-your-own-agent.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
