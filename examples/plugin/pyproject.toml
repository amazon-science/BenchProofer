[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "benchproofer-example-plugin"
version = "0.1.0"
description = "A worked example of a third-party Benchproofer plugin."
requires-python = ">=3.10"
license = "CC-BY-NC-4.0"
dependencies = ["benchproofer"]

# The same five entry-point groups the built-in components use. Nothing else is
# needed to make a component visible: install this package and it shows up in
# `benchproofer catalog`.
[project.entry-points."benchproofer.benchmarks"]
mini = "benchproofer_example.benchmark:MiniBenchmark"

[project.entry-points."benchproofer.gates"]
"spec.no_todo" = "benchproofer_example.gate:NoTodoGate"

[tool.hatch.build.targets.wheel]
packages = ["src/benchproofer_example"]
