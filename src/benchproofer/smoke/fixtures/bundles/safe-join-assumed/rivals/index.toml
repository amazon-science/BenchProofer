# The property-based test suite. Each case states the verdict the specification
# has to reach; a case that behaves otherwise is a finding, not an error.

[[rival]]
id = "uniqueness-1"
kind = "uniqueness"
expect = "refute"
file = "uniqueness-1.py"
rationale = "Normalizes the join and then returns it whatever it collapsed to, so a request with enough leading `..` walks out of the root and is still accepted."

[[rival]]
id = "uniqueness-2"
kind = "uniqueness"
expect = "refute"
file = "uniqueness-2.py"
rationale = "Refuses a join that begins with `..` but not one that climbs into a sibling of the root, which is the same escape spelled without a leading dot."

[[rival]]
id = "soundness-1"
kind = "soundness"
expect = "verify"
file = "soundness-1.py"
rationale = "Correct, but decides containment by comparing segments rather than by a prefix test on the joined string, so a specification that rejects it has pinned down one implementation."
