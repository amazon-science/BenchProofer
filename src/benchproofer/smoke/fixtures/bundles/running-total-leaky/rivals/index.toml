# The property-based test suite. Each case states the verdict the specification
# has to reach; a case that behaves otherwise is a finding, not an error.

[[rival]]
id = "uniqueness-1"
kind = "uniqueness"
expect = "refute"
file = "uniqueness-1.py"
rationale = "Records each subtotal before adding the current element, so every total is one element behind."

[[rival]]
id = "soundness-1"
kind = "soundness"
expect = "verify"
file = "soundness-1.py"
rationale = "Correct, but sums a prefix per element instead of carrying a subtotal, so a specification that rejects it has pinned down one implementation."
