# A leaky formalization of the running-total task.
#
# The specification compares the implementation against a copy of the golden patch,
# so whoever solves the formalized task can read the implementation off the
# specification itself. Every other gate passes, which is the point: leakage is not
# visible in a verification result, only in a comparison against the golden patch.

task_id = "running-total"
backend = "falsifier"
summary = "A specification that restates the golden patch."

[expect]
static = "rejected"
oracle = "rejected"

# Leakage is a failure, not an undecided result: the overlap with the golden patch
# is measured from the text and needs no verifier to establish.
[unfavorable]
static = ["spec.no_leakage"]
oracle = ["spec.no_leakage"]
