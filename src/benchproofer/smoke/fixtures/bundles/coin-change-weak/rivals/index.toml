# The property-based test suite. Each case states the verdict the specification
# has to reach; a case that behaves otherwise is a finding, not an error.

[[rival]]
id = "uniqueness-1"
kind = "uniqueness"
expect = "refute"
file = "uniqueness-1.py"
rationale = "Counts dimes out of the whole amount instead of the remainder, so above a quarter it reports more coins than the amount holds."

[[rival]]
id = "uniqueness-2"
kind = "uniqueness"
expect = "refute"
file = "uniqueness-2.py"
rationale = "Counts nickels out of the remainder without first taking the dimes out of it, so it double-counts every dime as a nickel too."

[[rival]]
id = "soundness-1"
kind = "soundness"
expect = "verify"
file = "soundness-1.py"
rationale = "Correct, but written as a loop over the denominations rather than four assignments, so a specification that rejects it has pinned down one implementation."
