# Conda environment for developing and running Benchproofer.
#
#   conda env create -f environment.yml
#   conda activate benchproofer
#   bash scripts/setup.sh
#
# This file provides the interpreter and the handful of system tools the project
# shells out to: git for the adapters that read a repository, curl/unzip/zstd for
# the verifier toolchain installers, make for the entry points in the Makefile.
# The Python packages are installed by scripts/setup.sh, which applies the version
# lock in constraints/ so that two people get the same dependency tree.
#
# Docker is not installable from conda. Only the container oracle needs it, and
# `benchproofer doctor` reports it as unavailable with a hint when it is missing.
name: benchproofer
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip>=24.0
  - curl
  - git
  - make
  - unzip
  - zstd
